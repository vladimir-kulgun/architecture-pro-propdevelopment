# =========================
# Cluster-admin access for alice
# =========================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alice-cluster-admin
subjects:
  - kind: User
    name: alice
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: pro-development:cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# =========================
# View-only access for bob (cluster-scoped)
# =========================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bob-view-only
subjects:
  - kind: User
    name: bob
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: pro-development:view-only
  apiGroup: rbac.authorization.k8s.io
---
# =========================
# Namespace-scoped access for carol (pro-development-accountant)
# =========================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carol-accountant-privileged
  namespace: pro-development-accountant
subjects:
  - kind: User
    name: carol
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pro-development:privileged-view
  apiGroup: rbac.authorization.k8s.io
