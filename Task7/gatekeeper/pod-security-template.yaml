apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8spsp
spec:
  crd:
    spec:
      names:
        kind: K8sPSP
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsp

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          container := input.review.object.spec.containers[_]

          # Privileged containers are forbidden
          container.securityContext.privileged == true
          msg := sprintf("Privileged containers are forbidden: %v", [container.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          container := input.review.object.spec.containers[_]

          # Must run as non-root
          not container.securityContext.runAsNonRoot
          msg := sprintf("Containers must run as non-root: %v", [container.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          container := input.review.object.spec.containers[_]

          # Root filesystem must be read-only
          not container.securityContext.readOnlyRootFilesystem
          msg := sprintf("Root filesystem must be read-only: %v", [container.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          volume := input.review.object.spec.volumes[_]

          # hostPath volumes are forbidden
          volume.hostPath
          msg := sprintf("hostPath volumes are forbidden: %v", [volume.name])
        }
