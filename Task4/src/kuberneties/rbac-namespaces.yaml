# =========================
# Privileged users - namespace scoped
# =========================

# Namespace: pro-development-client
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pro-development:privileged-view
  namespace: pro-development-client
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pro-development:privileged-view
  namespace: pro-development-client
subjects:
  - kind: Group
    name: privileged-users
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pro-development:privileged-view
  apiGroup: rbac.authorization.k8s.io
---
