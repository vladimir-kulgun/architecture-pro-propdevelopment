# =========================
# View-only users - cluster scoped (without secrets)
# =========================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pro-development:view-only
rules:
  - apiGroups: ["", "apps", "batch", "extensions"]
    resources: [
      "pods",
      "deployments",
      "replicasets",
      "statefulsets",
      "daemonsets",
      "services",
      "configmaps",
      "jobs",
      "cronjobs",
      "ingresses"
    ]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pro-development:view-only
subjects:
  - kind: Group
    name: view-only-users
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: pro-development:view-only
  apiGroup: rbac.authorization.k8s.io
---
# =========================
# Cluster-admin users - full access
# =========================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pro-development:cluster-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pro-development:cluster-admin
subjects:
  - kind: Group
    name: cluster-admin-users
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: pro-development:cluster-admin
  apiGroup: rbac.authorization.k8s.io
